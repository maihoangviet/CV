name: build
on:
  push:
    paths:
      - "src/**.tex"
      - ".github/workflows/build.yml"
      - CNAME
      - index.html

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: src
      FILE: cv
      PDF_NAME: "CV - Mai Hoang Viet - DevOps Engineer.pdf"
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache LaTeX packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.texlive
            /tmp/texlive
            /usr/local/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('src/*.tex') }}
          restore-keys: |
            texlive-${{ runner.os }}-

      - name: Build LaTeX document
        uses: dante-ev/latex-action@2024-B
        with:
          root_file: ${{ env.FILE }}.tex
          working_directory: ${{ env.DIR }}
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Rename and move PDF
        run: |
          mkdir -p github_artifacts
          mv ${{ env.DIR }}/${{ env.FILE }}.pdf ./github_artifacts/"${{ env.PDF_NAME }}"

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-artifact
          path: ./github_artifacts
          retention-days: 1

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache static files
        uses: actions/cache@v4
        with:
          path: |
            index.html
            CNAME
          key: static-files-${{ runner.os }}-${{ hashFiles('index.html', 'CNAME') }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-artifact
          path: github_artifacts

      - name: Move files
        run: |
          mkdir -p github_deploy
          mv github_artifacts/* github_deploy/

      - name: Deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: false

  sync-assets-to-build:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Cache git data
        uses: actions/cache@v4
        with:
          path: |
            .git
          key: git-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            git-cache-${{ runner.os }}-

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy index.html, CNAME
        uses: planetoftheweb/copy-to-branches@v1.3
        env:
          key: main
          files: index.html CNAME