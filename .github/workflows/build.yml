name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**/*.tex"
      - ".github/workflows/build.yml"
      - CNAME
      - index.html

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIR: src
      FILE: cv
      PDF_NAME: "CV - Mai Hoang Viet - DevOps Engineer.pdf"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Detect source changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            tex:
              - "src/**/*.tex"

      - name: Build LaTeX document
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.tex == 'true'
        uses: dante-ev/latex-action@2024-B
        with:
          root_file: ${{ env.FILE }}.tex
          working_directory: ${{ env.DIR }}
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Prepare deploy directory
        run: |
          mkdir -p github_deploy
          cp index.html ./github_deploy/
          if [ -f CNAME ]; then cp CNAME ./github_deploy/; fi

      - name: Use newly built PDF
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.tex == 'true'
        run: cp "${{ env.DIR }}/${{ env.FILE }}.pdf" "./github_deploy/${{ env.PDF_NAME }}"

      - name: Reuse latest published PDF
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.tex != 'true'
        run: |
          git fetch origin build --depth=1
          if ! git show "origin/build:${{ env.PDF_NAME }}" > "./github_deploy/${{ env.PDF_NAME }}"; then
            echo "No published PDF found in build branch. Push a src/**/*.tex change once to generate the first PDF."
            exit 1
          fi

      - name: Verify deploy assets
        run: |
          test -f ./github_deploy/index.html
          test -s "./github_deploy/${{ env.PDF_NAME }}"

      - name: Deploy to build branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: build
          folder: github_deploy
          clean: true
