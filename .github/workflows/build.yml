name: build
on:
  push:
    paths:
      - "src/**.tex"
      - ".github/workflows/build.yml"
      - CNAME
      - index.html
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: src
      FILE: cv
      PDF_NAME: "CV - Mai Hoang Viet - DevOps Engineer.pdf"
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Cache LaTeX auxiliary files
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DIR }}/*.aux
            ${{ env.DIR }}/*.lof
            ${{ env.DIR }}/*.lot
            ${{ env.DIR }}/*.fls
            ${{ env.DIR }}/*.out
            ${{ env.DIR }}/*.toc
            ${{ env.DIR }}/*.fmt
            ${{ env.DIR }}/*.fot
            ${{ env.DIR }}/*.cb
            ${{ env.DIR }}/*.cb2
            ${{ env.DIR }}/.*.lb
            ${{ env.DIR }}/*.bbl
            ${{ env.DIR }}/*.bcf
            ${{ env.DIR }}/*.blg
            ${{ env.DIR }}/*-blx.aux
            ${{ env.DIR }}/*-blx.bib
            ${{ env.DIR }}/*.run.xml
          key: ${{ runner.os }}-latex-${{ hashFiles('${{ env.DIR }}/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-latex-
      - name: Build LaTeX document
        uses: dante-ev/latex-action@edge
        with:
          root_file: ${{ env.FILE }}.tex
          working_directory: ${{ env.DIR }}
      - name: Rename and move PDF
        run: |
          mkdir -p github_artifacts
          mv ${{ env.DIR }}/${{ env.FILE }}.pdf ./github_artifacts/"${{ env.PDF_NAME }}"
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-artifact
          path: ./github_artifacts

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-artifact
          path: github_artifacts
      - name: Move files
        run: |
          mkdir -p github_deploy
          mv github_artifacts/* github_deploy/
      - name: Deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true

  sync-assets-to-build:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy index.html, CNAME
        uses: planetoftheweb/copy-to-branches@v1.3
        env:
          key: main
          files: index.html CNAME