name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: .
      FILE: cv
      PDF_NAME: "CV - Mai Hoang Viet - DevOps Engineer.pdf"
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Build LaTeX document
        uses: dante-ev/latex-action@latest
        with:
          root_file: ${{ env.FILE }}.tex
          working_directory: ${{ env.DIR }}
      - name: Rename and move PDF
        run: |
          mkdir -p github_artifacts
          mv ${{ env.DIR }}/${{ env.FILE }}.pdf ./github_artifacts/"${{ env.PDF_NAME }}"
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-artifact
          path: ./github_artifacts

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-artifact
          path: github_artifacts
      - name: Move files
        run: |
          mkdir -p github_deploy
          mv github_artifacts/* github_deploy/
      - name: Deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true

  sync-assets-to-build:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy index.html, CNAME, images
        uses: planetoftheweb/copy-to-branches@v1.3
        env:
          key: main
          files: index.html CNAME images